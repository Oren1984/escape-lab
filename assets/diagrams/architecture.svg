    <rect x="430" y="132" width="140" height="30" rx="8"/>
    <rect x="240" y="180" width="330" height="36" rx="10"/>
    <rect x="660" y="100" width="270" height="62" rx="10" stroke="#34c38f"/>
    <rect x="660" y="196" width="270" height="56" rx="10"/>
    <rect x="660" y="286" width="270" height="56" rx="10"/>
    <rect x="660" y="376" width="270" height="56" rx="10"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="ESCAPE LAB architecture: LAB-01 proposes, an independent controller decides, the simulation engine commits only allowed actions, and everything is recorded as evidence.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ea3bf"/></marker>

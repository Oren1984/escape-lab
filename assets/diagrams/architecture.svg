    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker>
  </defs>
  <rect width="980" height="470" rx="18" fill="#060b16"/>
  <text x="30" y="38" fill="#22d3ee" font-size="12" letter-spacing="3" font-family="Consolas, monospace">ESCAPE LAB · ONE TICK</text>

  <rect x="30" y="60" width="560" height="170" rx="14" fill="none" stroke="#f5a524" stroke-dasharray="6 6" stroke-opacity=".6"/>
  <text x="46" y="82" fill="#f5a524" font-size="11" letter-spacing="2">UNTRUSTED · CAN ONLY PROPOSE</text>
  <rect x="640" y="60" width="310" height="388" rx="14" fill="none" stroke="#34c38f" stroke-dasharray="6 6" stroke-opacity=".6"/>
  <text x="656" y="82" fill="#34c38f" font-size="11" letter-spacing="2">TRUSTED · DECIDES AND COMMITS</text>


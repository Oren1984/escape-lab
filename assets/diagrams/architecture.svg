    <rect x="50" y="376" width="520" height="56" rx="10" stroke="#22d3ee"/>
    <rect x="340" y="286" width="230" height="56" rx="10"/>
  </g>
  <g fill="#dbe7f5" font-size="14" font-weight="600" text-anchor="middle">
    <text x="125" y="125">Scenario</text>
    <text x="315" y="125">LAB-01 agent</text>
    <text x="500" y="114" font-size="12">Rules Engine</text>
    <text x="500" y="152" font-size="12">Local LLM (optional)</text>
    <text x="405" y="203" font-size="13">Structured ActionProposal</text>
    <text x="795" y="127">Containment controller</text>
    <text x="795" y="221">Simulation engine</text>
    <text x="795" y="311">Shutdown controller</text>
    <text x="795" y="401">Evidence recorder</text>
    <text x="175" y="311">Metrics + scoring oracle</text>
    <text x="310" y="401">Streamlit laboratory (5 pages)</text>
    <text x="455" y="311">Lab runtime</text>
  </g>
  <g fill="#8ea3bf" font-size="11" text-anchor="middle">
    <text x="125" y="143">seeded, bounded</text>
    <text x="315" y="143">read-only observation</text>
    <text x="795" y="146">allowlist · limits · stop boundary</text>
    <text x="795" y="239">only mutator of world state</text>
    <text x="795" y="329">freeze · fingerprint · run generation</text>
    <text x="795" y="419">append-only · JSON / CSV / JSONL</text>
    <text x="175" y="329">classification independent of controller</text>
    <text x="310" y="419">sends commands, reads snapshots</text>
    <text x="455" y="329">steps the run outside the UI</text>
  </g>

  <path d="M795 162V194" fill="none" stroke="#34c38f" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="806" y="183" fill="#34c38f" font-size="11">ALLOW only</text>
  <path d="M795 252V284" fill="none" stroke="#8ea3bf" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M795 342V374" fill="none" stroke="#8ea3bf" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M660 395C620 395 330 360 302 322" fill="none" stroke="#8ea3bf" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 4"/>
  <text x="30" y="258" fill="#5d7291" font-size="11">Everything is a synthetic simulation. Replicas are records in a list. No process, container or network service is created.</text>
</svg>

# ESCAPE LAB: one service, localhost only, no privileges.
#   docker compose up --build      then open http://localhost:8501
services:
  escape-lab:
    build: .
    image: escape-lab:local
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      # Optional local LLM. Off by default; nothing is downloaded automatically.
      ESCAPE_LAB_LLM_ENABLED: "${ESCAPE_LAB_LLM_ENABLED:-0}"
      ESCAPE_LAB_LLM_MODEL: "${ESCAPE_LAB_LLM_MODEL:-}"
      ESCAPE_LAB_OLLAMA_URL: "${ESCAPE_LAB_OLLAMA_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - lab-data:/data/runs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    init: true
    stop_grace_period: 10s
    restart: "no"

volumes:
  lab-data:
